<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>관절가동범위(ROM) 측정과 표기 — 전공의 교육</title>
<style>
:root{
  --navy:#12314f; --navy2:#1d4a75; --teal:#0d7377; --teal2:#14919b;
  --amber:#b45309; --amberbg:#fff7ed; --amberbd:#fdba74;
  --red:#b91c1c; --redbg:#fef2f2; --redbd:#fca5a5;
  --green:#166534; --greenbg:#f0fdf4; --greenbd:#86efac;
  --bg:#f5f7fa; --card:#ffffff; --line:#dde5ed; --ink:#16202b; --mute:#5b6b7c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--teal) 130%);
  color:#fff; padding:18px 16px 14px; position:relative;
}
header h1{margin:0;font-size:19px;letter-spacing:-.3px;font-weight:800}
header .sub{margin-top:5px;font-size:12.5px;opacity:.85;line-height:1.5}
header .badge{display:inline-block;margin-top:8px;font-size:11px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);padding:3px 9px;border-radius:20px}

nav{position:sticky;top:0;z-index:50;background:var(--navy);display:flex;overflow-x:auto;
  scrollbar-width:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:none;color:#a9c2d8;font-size:13.5px;font-weight:700;
  padding:13px 15px;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--teal2);background:rgba(255,255,255,.07)}

main{padding:14px 12px 60px;max-width:900px;margin:0 auto}
section{display:none} section.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px;
  box-shadow:0 1px 3px rgba(18,49,79,.05)}
h2.st{font-size:17px;margin:2px 0 12px;color:var(--navy);font-weight:800;
  border-left:5px solid var(--teal);padding-left:10px;line-height:1.35}
h3.sst{font-size:14.5px;margin:16px 0 8px;color:var(--navy2);font-weight:800}
h3.sst:first-child{margin-top:0}
p{margin:8px 0}
.mute{color:var(--mute);font-size:13px}

.box{border-radius:10px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.6;border:1px solid}
.box b{display:block;margin-bottom:4px;font-size:13px;letter-spacing:-.2px}
.warn{background:var(--amberbg);border-color:var(--amberbd);color:#7c2d12}
.crit{background:var(--redbg);border-color:var(--redbd);color:#7f1d1d}
.good{background:var(--greenbg);border-color:var(--greenbd);color:#14532d}
.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a5f}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#eef3f8;color:var(--navy);font-weight:800;white-space:nowrap;font-size:12.5px}
td.c,th.c{text-align:center}
tr.hl td{background:#fff7ed}
.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:800;margin-right:3px}
.c-red{background:#fee2e2;color:#991b1b} .c-amb{background:#ffedd5;color:#9a3412}
.c-grn{background:#dcfce7;color:#166534} .c-blu{background:#dbeafe;color:#1e40af}
.c-gry{background:#e8edf2;color:#475569}

.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:#fff}
.acc>.hd{padding:12px 13px;background:#f2f6fa;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:14px}
.acc>.hd .rg{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap}
.acc>.hd::after{content:"▾";color:var(--mute);font-size:12px;transition:.2s}
.acc.open>.hd::after{transform:rotate(180deg)}
.acc>.bd{display:none;padding:13px;border-top:1px solid var(--line)}
.acc.open>.bd{display:block}

.figwrap{background:#fbfdff;border:1px solid var(--line);border-radius:9px;padding:6px;margin:8px 0}
svg{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--mute);padding:4px 6px 2px}
.leg i{display:inline-block;width:16px;height:0;border-top-width:3px;vertical-align:middle;margin-right:4px}

dl.tech{margin:8px 0 0;font-size:13.5px}
dl.tech dt{font-weight:800;color:var(--navy2);margin-top:9px;font-size:12.5px}
dl.tech dd{margin:2px 0 0 0;padding-left:0;line-height:1.6}

.sftrbox{background:var(--navy);color:#dff2f3;font-family:ui-monospace,Menlo,Consolas,monospace;
  padding:9px 12px;border-radius:8px;font-size:14px;margin:8px 0;letter-spacing:.4px;overflow-x:auto;white-space:nowrap}
.sftrbox .k{color:#7dd3d8;font-weight:700}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.ctrl label{font-size:12.5px;font-weight:700;color:var(--navy2)}
.ctrl input[type=number]{width:66px;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;
  font-size:15px;font-family:inherit;text-align:center}
.ctrl select{padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
.btn{background:var(--teal);color:#fff;border:none;padding:9px 15px;border-radius:8px;font-size:13.5px;
  font-weight:800;cursor:pointer;font-family:inherit}
.btn.alt{background:#e6edf3;color:var(--navy)}
.btn:active{opacity:.8}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{background:#eef3f8;border:1px solid var(--line);color:var(--navy);font-size:12px;
  padding:6px 10px;border-radius:16px;cursor:pointer;font-family:inherit;font-weight:700}

.q{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:#fff}
.q .num{font-size:11.5px;font-weight:800;color:var(--teal);letter-spacing:.4px}
.q .qt{font-weight:700;margin:5px 0 10px;font-size:14px;line-height:1.6}
.q .opt{display:block;width:100%;text-align:left;background:#f7fafc;border:1.5px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13.5px;cursor:pointer;font-family:inherit;line-height:1.5}
.q .opt.ok{background:var(--greenbg);border-color:var(--greenbd);font-weight:700}
.q .opt.no{background:var(--redbg);border-color:var(--redbd)}
.q .exp{display:none;margin-top:8px;padding:10px 12px;background:#f0f7ff;border-left:4px solid var(--navy2);
  border-radius:0 8px 8px 0;font-size:13px;line-height:1.65}
.q.done .exp{display:block}
.score{position:sticky;top:44px;z-index:40;background:var(--navy2);color:#fff;padding:9px 13px;
  border-radius:9px;font-size:13.5px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between}

.reflist{font-size:12.5px;line-height:1.7;padding-left:20px;margin:6px 0}
.reflist li{margin-bottom:5px}
.evid{font-size:11px;color:var(--mute);font-style:normal}
footer{text-align:center;font-size:11.5px;color:var(--mute);padding:22px 14px 34px;line-height:1.7}
.pill{display:inline-block;background:#eef3f8;border:1px solid var(--line);border-radius:14px;
  padding:2px 9px;font-size:11.5px;color:var(--navy2);font-weight:700;margin:2px 3px 2px 0}
</style>
</head>
<body>

<header>
  <h1>관절가동범위(ROM) 측정과 표기</h1>
  <div class="sub">주요 관절 중심 · Neutral-Zero / SFTR / AAOS / AMA Guides 대조<br>재활의학과 전공의 교육용 · 오프라인 단독 실행</div>
  <span class="badge">v1 · 2026.09</span>
</header>

<nav id="nav"></nav>

<main>
  <section id="s-principle" class="on"></section>
  <section id="s-notation"></section>
  <section id="s-ue"></section>
  <section id="s-spine"></section>
  <section id="s-le"></section>
  <section id="s-norms"></section>
  <section id="s-quiz"></section>
  <section id="s-ref"></section>
</main>

<footer>
  본 자료는 교육 목적이며, 장해평가·진단서 작성 시에는 해당 기준의 원전(AAOS 소책자, AMA Guides 해당 판,<br>
  국민연금 「신체장애 운동범위 측정기준」, 산재 시행규칙 별표 5)을 반드시 직접 대조하십시오.<br>
  <span style="opacity:.7">부산대학교병원 재활의학과 · 전공의 교육자료</span>
</footer>

<script>
/* ============================================================
   SVG 도해 생성기 — 골격 분절(회색) + 각도계 고정팔(점선 남색)
   + 이동팔(실선 청록) + 축(적색) + 운동호
   ============================================================ */
const D2R = Math.PI/180;
// 각도 t: 위쪽(12시)=0, 시계방향 +
function P(cx,cy,r,t){ return [cx + r*Math.sin(t*D2R), cy - r*Math.cos(t*D2R)]; }
function fmt(n){ return Math.round(n*10)/10; }

function arcPath(cx,cy,r,t1,t2){
  const [x1,y1]=P(cx,cy,r,t1), [x2,y2]=P(cx,cy,r,t2);
  const large = Math.abs(t2-t1)>180?1:0, sweep = t2>t1?1:0;
  return `M ${fmt(x1)} ${fmt(y1)} A ${r} ${r} 0 ${large} ${sweep} ${fmt(x2)} ${fmt(y2)}`;
}

/* 도해 config:
   {w,h, jx,jy, segs:[{t,len,wd,label,lt}], fix:{t,len,label},
    mov:{t,len,label}, arc:{from,to,label,r}, notes:[{x,y,text,anchor,size}], axisLabel}
*/
function fig(c){
  const w=c.w||330, h=c.h||250, jx=c.jx, jy=c.jy;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="측정 도해">`;
  s+=`<rect width="${w}" height="${h}" fill="#fbfdff"/>`;
  // 배경 격자 기준선
  if(c.ground) s+=`<line x1="0" y1="${c.ground}" x2="${w}" y2="${c.ground}" stroke="#e3ebf2" stroke-width="2" stroke-dasharray="6 5"/>`;
  // 신체 분절
  (c.segs||[]).forEach(g=>{
    const ox = g.ox||0, oy = g.oy||0;
    const [x2,y2]=P(jx+ox,jy+oy,g.len,g.t);
    s+=`<line x1="${jx+ox}" y1="${jy+oy}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="#b9c7d4" stroke-width="${g.wd||17}" stroke-linecap="round"/>`;
    if(g.label){
      const [lx,ly]=P(jx+ox,jy+oy,g.len*(g.lp||0.55),g.t);
      s+=`<text x="${fmt(lx+(g.dx||0))}" y="${fmt(ly+(g.dy||0))}" font-size="10.5" fill="#5b6b7c" text-anchor="middle" font-weight="700">${g.label}</text>`;
    }
  });
  // 운동 호
  if(c.arc){
    const r=c.arc.r||58;
    s+=`<path d="${arcPath(jx,jy,r,c.arc.from,c.arc.to)}" fill="none" stroke="#0d7377" stroke-width="2.4" stroke-dasharray="4 3" opacity=".75"/>`;
    const mid=(c.arc.from+c.arc.to)/2, [ax,ay]=P(jx,jy,r+15,mid);
    s+=`<text x="${fmt(ax)}" y="${fmt(ay)}" font-size="11.5" fill="#0d7377" font-weight="800" text-anchor="middle">${c.arc.label}</text>`;
    // 화살촉
    const [hx,hy]=P(jx,jy,r,c.arc.to);
    const dir = c.arc.to>c.arc.from?1:-1;
    const [bx,by]=P(jx,jy,r,c.arc.to-dir*7);
    s+=`<polygon points="${fmt(hx)},${fmt(hy)} ${fmt(bx+dir*4)},${fmt(by+4)} ${fmt(bx-dir*3)},${fmt(by-5)}" fill="#0d7377" opacity=".85"/>`;
  }
  // 라벨 배치 보정: 캔버스 밖·상하 노트영역 침범 방지
  const topBand=(c.topBand===undefined?44:c.topBand), botBand=(c.botBand===undefined?h-30:c.botBand);
  function place(lx,ly,txt,anchor){
    const plain=String(txt).replace(/<[^>]*>/g,'');
    let tw=0; for(const ch of plain){ tw += /[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF]/.test(ch) ? 11 : 6; }
    let a=anchor||'middle';
    if(a==='middle'){
      if(lx-tw/2<6) a='start'; else if(lx+tw/2>w-6) a='end';
    }
    if(a==='start') lx=Math.min(Math.max(lx,6), w-6-tw);
    else if(a==='end') lx=Math.max(Math.min(lx,w-6), 6+tw);
    else lx=Math.min(Math.max(lx,6+tw/2), w-6-tw/2);
    ly=Math.min(Math.max(ly,topBand),botBand);
    return [fmt(lx),fmt(ly),a];
  }
  // 고정팔
  if(c.fix){
    const [x2,y2]=P(jx,jy,c.fix.len,c.fix.t);
    s+=`<line x1="${jx}" y1="${jy}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="#12314f" stroke-width="2.6" stroke-dasharray="7 4"/>`;
    const [fx0,fy0]=P(jx,jy,c.fix.len+(c.fix.lo||16),c.fix.t);
    const [lx,ly,an]=place(fx0+(c.fix.ldx||0),fy0+(c.fix.ldy||0),c.fix.label,c.fix.anchor);
    s+=`<text x="${lx}" y="${ly}" font-size="11" fill="#12314f" font-weight="800" text-anchor="${an}">${c.fix.label}</text>`;
  }
  // 이동팔
  if(c.mov){
    const [x2,y2]=P(jx,jy,c.mov.len,c.mov.t);
    s+=`<line x1="${jx}" y1="${jy}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="#0d7377" stroke-width="3.2"/>`;
    const [mx0,my0]=P(jx,jy,c.mov.len+(c.mov.lo||16),c.mov.t);
    const [lx,ly,an]=place(mx0+(c.mov.ldx||0),my0+(c.mov.ldy||0),c.mov.label,c.mov.anchor);
    s+=`<text x="${lx}" y="${ly}" font-size="11" fill="#0d7377" font-weight="800" text-anchor="${an}">${c.mov.label}</text>`;
  }
  // 축
  s+=`<circle cx="${jx}" cy="${jy}" r="6.5" fill="#fff" stroke="#b91c1c" stroke-width="3"/>`;
  s+=`<circle cx="${jx}" cy="${jy}" r="2" fill="#b91c1c"/>`;
  if(c.axisLabel){
    const [alx,aly,alan]=place(jx+(c.alx||0), jy+(c.aly||-14), c.axisLabel, c.alAnchor);
    s+=`<text x="${alx}" y="${aly}" font-size="10.5" fill="#b91c1c" font-weight="800" text-anchor="${alan}">${c.axisLabel}</text>`;
  }
  (c.notes||[]).forEach(n=>{
    s+=`<text x="${n.x}" y="${n.y}" font-size="${n.size||10.5}" fill="${n.fill||'#5b6b7c'}" text-anchor="${n.anchor||'start'}" font-weight="${n.w||600}">${n.text}</text>`;
  });
  s+=`</svg>`;
  return `<div class="figwrap">${s}
    <div class="leg">
      <span><i style="border-top:3px solid #b9c7d4"></i>신체 분절</span>
      <span><i style="border-top:3px dashed #12314f"></i>고정팔</span>
      <span><i style="border-top:3px solid #0d7377"></i>이동팔</span>
      <span><span style="display:inline-block;width:9px;height:9px;border:2.5px solid #b91c1c;border-radius:50%;vertical-align:middle;margin-right:4px"></span>축(중심)</span>
    </div></div>`;
}
</script>
<script>
/* ===== 탭 ===== */
const TABS=[
 ['s-principle','기본원칙'],['s-notation','표기법'],['s-ue','상지'],['s-spine','척추'],
 ['s-le','하지'],['s-norms','정상치·불일치'],['s-quiz','퀴즈'],['s-ref','근거']
];
(function(){
  const n=document.getElementById('nav');
  n.innerHTML=TABS.map((t,i)=>`<button data-t="${t[0]}" class="${i===0?'on':''}">${t[1]}</button>`).join('');
  n.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    n.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    document.querySelectorAll('main section').forEach(s=>s.classList.remove('on'));
    document.getElementById(b.dataset.t).classList.add('on');
    window.scrollTo({top:0,behavior:'instant'});
  });
})();
/* 아코디언 위임 */
document.addEventListener('click',e=>{
  const h=e.target.closest('.acc>.hd'); if(h) h.parentElement.classList.toggle('open');
});

/* ===== 1. 기본원칙 ===== */
document.getElementById('s-principle').innerHTML=`
<div class="card">
  <h2 class="st">이 자료의 검증 표기</h2>
  <p class="mute" style="margin-top:0">ROM 분야는 <b>"정상치 단일 표준이 존재하지 않는다"</b>는 점이 가장 큰 함정입니다.
  본 자료는 모든 수치에 출처 등급을 붙였습니다.</p>
  <div class="tw"><table>
    <tr><th style="width:78px">등급</th><th>의미</th></tr>

    <tr><td class="c"><span class="chip c-blu">2차</span></td><td>표준 교과서(Norkin&amp;White 등)를 재현한 2차 자료에서 <b>2개 이상 독립 출처가 일치</b></td></tr>
    <tr><td class="c"><span class="chip c-amb">불일치</span></td><td>출처 간 값이 다름 — 기관 내 프로토콜로 통일 필요</td></tr>
    <tr><td class="c"><span class="chip c-red">미확인</span></td><td>원전 접근 실패 — 추정치를 기입하지 않음. 원서 대조 필수</td></tr>
  </table></div>
  <div class="box crit"><b>⚠ 가장 먼저 알아야 할 사실</b>
  "AAOS 정상치"라고 유통되는 표들 상당수가 실제로는 AAOS 원전에 없는 값을 섞어 놓았습니다.
  예: 한 동료심사 논문 부록은 각주에서 "손가락 값은 AAOS가 아니라 Richard &amp; Parry 자료에서 유도", "어깨 내전 값은 AAOS에 없음",
  "엄지 CMC 값은 우리가 추가"라고 스스로 밝히고 있습니다. <b>차트에 값을 적을 때 반드시 "어느 기준인지"를 병기</b>하십시오.</div>
</div>

<div class="card">
  <h2 class="st">AROM vs PROM — 무엇을 왜 나누어 적는가</h2>
  <div class="tw"><table>
    <tr><th style="width:88px">구분</th><th>정의</th><th>임상 의미</th></tr>
    <tr><td><b>AROM</b><br>능동</td><td>환자가 <b>스스로, 도움 없이</b> 근수축으로 만드는 운동호</td><td>근력 + 통증 + 운동조절 + 관절 상태의 <b>합</b></td></tr>
    <tr><td><b>PROM</b><br>수동</td><td>검사자가 만드는 운동호</td><td><b>관절·연부조직 자체</b>의 가동성. 종말감(end-feel) 평가는 오직 여기서</td></tr>
  </table></div>
  <p><b>PROM ≥ AROM인 이유</b> — 이완된 근육은 부피가 작아 연부조직 접근(soft tissue approximation)이 늦게 일어나고,
  검사자의 overpressure가 조직을 추가로 신장시키기 때문입니다. <span class="evid">[Physiopedia, Assessing ROM]</span></p>
  <div class="tw"><table>
    <tr><th>패턴</th><th>해석</th></tr>
    <tr class="hl"><td><b>PROM ≫ AROM (간극 큼)</b></td><td>근력 약화(근·건 파열, 말초신경손상, 근병증) / 통증 억제 / 상위운동신경원 병변의 선택적 운동조절 장애</td></tr>
    <tr><td><b>PROM ≈ AROM, 둘 다 감소</b></td><td>관절 자체 문제 — 구축, 관절낭 유착, 골성 차단</td></tr>
  </table></div>
  <div class="box good"><b>실무 순서</b> ① AROM 먼저 (환자의 의지·통증 발생 각도 확인) → ② PROM 나중 (종말감 평가).
  반대로 하면 통증 유발로 AROM이 인위적으로 감소합니다.</div>
</div>

<div class="card">
  <h2 class="st">종말감(End-feel) — Cyriax 분류</h2>

    <tr><th style="width:110px">종류</th><th>성질</th><th>대표 예</th></tr>

<script>
/* ===== 2. 표기법 ===== */
function notationSVG(a,b,c,mode){
  // mode: 'normal' | 'ankyl'
  const w=340,h=250,cx=170,cy=150,R=108;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  s+=`<rect width="${w}" height="${h}" fill="#fbfdff"/>`;
  // 눈금
  for(let t=-180;t<=180;t+=15){
    const big = t%45===0;
    const [x1,y1]=P(cx,cy,R+(big?0:5),t), [x2,y2]=P(cx,cy,R+(big?13:9),t);
    s+=`<line x1="${fmt(x1)}" y1="${fmt(y1)}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="#cfdae5" stroke-width="${big?1.6:1}"/>`;

      s+=`<text x="${fmt(lx)}" y="${fmt(ly+3)}" font-size="9" fill="#9fb0c0" text-anchor="middle">${Math.abs(t)}</text>`;}
  }
  if(mode==='ankyl'){
    const ang = a>0 ? -a : c;
    s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fed7aa" opacity=".3"/>`;
    const [x2,y2]=P(cx,cy,R,ang);
    s+=`<line x1="${cx}" y1="${cy}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>`;
    const [lx,ly]=P(cx,cy,R+34,ang);
    s+=`<text x="${fmt(lx)}" y="${fmt(ly)}" font-size="12" fill="#b91c1c" font-weight="800" text-anchor="middle">${Math.abs(ang)}° 고정</text>`;
    s+=`<text x="${w-8}" y="${h-8}" font-size="12" fill="#b91c1c" font-weight="800" text-anchor="end">강직(ankylosis) — 운동 없음</text>`;
  }else{
    // 활동 범위
    let lo,hi,blockedFrom=null,blockedTo=null;
    if(b>0){
      if(c>0){ lo=b; hi=c; blockedFrom=0; blockedTo=b; }
      else { lo=-a; hi=-b; blockedFrom=-b; blockedTo=0; }
    } else { lo=-a; hi=c; }
    if(blockedFrom!==null){
      const [bx1,by1]=P(cx,cy,R,blockedFrom),[bx2,by2]=P(cx,cy,R,blockedTo);
      s+=`<path d="M ${cx} ${cy} L ${fmt(bx1)} ${fmt(by1)} A ${R} ${R} 0 0 ${blockedTo>blockedFrom?1:0} ${fmt(bx2)} ${fmt(by2)} Z" fill="#fdba74" opacity=".38"/>`;
      const mid=(blockedFrom+blockedTo)/2,[mx,my]=P(cx,cy,R*0.72,mid+(blockedTo>blockedFrom?11:-11));
      s+=`<text x="${fmt(mx)}" y="${fmt(my)}" font-size="10" fill="#9a3412" font-weight="800" text-anchor="middle">도달 불가</text>`;
    }
    const [ax1,ay1]=P(cx,cy,R,lo),[ax2,ay2]=P(cx,cy,R,hi);
    s+=`<path d="M ${cx} ${cy} L ${fmt(ax1)} ${fmt(ay1)} A ${R} ${R} 0 ${Math.abs(hi-lo)>180?1:0} 1 ${fmt(ax2)} ${fmt(ay2)} Z" fill="#0d7377" opacity=".16"/>`;
    s+=`<path d="${arcPath(cx,cy,R,lo,hi)}" fill="none" stroke="#0d7377" stroke-width="3.4"/>`;
    [[lo,'#0d7377'],[hi,'#0d7377']].forEach(([t,col])=>{
      const [x2,y2]=P(cx,cy,R,t);
      s+=`<line x1="${cx}" y1="${cy}" x2="${fmt(x2)}" y2="${fmt(y2)}" stroke="${col}" stroke-width="3"/>`;
      const [lx,ly]=P(cx,cy,R+30,t);
      s+=`<text x="${fmt(lx)}" y="${fmt(ly)}" font-size="12" fill="${col}" font-weight="800" text-anchor="middle">${Math.abs(t)}°</text>`;
    });
    s+=`<text x="${w-8}" y="${h-8}" font-size="12" fill="#0d7377" font-weight="800" text-anchor="end">가동범위 ${Math.abs(hi-lo)}°</text>`;
  }
  // 0° 기준선
  const [zx,zy]=P(cx,cy,R+2,0);
  s+=`<line x1="${cx}" y1="${cy}" x2="${fmt(zx)}" y2="${fmt(zy)}" stroke="#12314f" stroke-width="2.6" stroke-dasharray="6 4"/>`;
  s+=`<text x="8" y="${h-8}" font-size="11.5" fill="#12314f" font-weight="800">┊ 0° 중립 (neutral zero)</text>`;
  // 방향 라벨
  s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#12314f"/>`;
  s+=`</svg>`;
  return `<div class="figwrap">${s}<div class="leg" style="justify-content:space-between">
    <span><b style="color:#12314f">◀ 첫 숫자</b> 신전·외전·외회전·회외·좌측</span>

}

(function(){

  let mode='normal', note='';
  function render(){
    const a=+A.value||0,b=+B.value||0,c=+C.value||0,p=PL.value;
    let code, desc;
    if(mode==='ankyl'){
      const ang=a>0?a:c;
      code=`${p} ${a>0?ang+'-0':'0-'+ang}`;
      desc=`<b>강직 표기</b> — SFTR/AMA는 숫자 <b>2개</b>로 적습니다. 0을 기준으로 ${a>0?'왼쪽(신전·외전·외회전) 방향':'오른쪽(굴곡·내전·내회전) 방향'} ${ang}° 위치에 고정.`;
    }else{
      code=`${p} ${a}-${b}-${c}`;
      if(b>0) desc=`<b>가운데 숫자가 0이 아님</b> → 중립위(0°)에 <b>도달하지 못함</b>. ${b}°가 이 환자의 실제 시작 위치이고, 그쪽 방향의 첫 숫자는 반드시 0이 됩니다. 총 가동범위 <b>${Math.abs(c>0?c-b:b-a)}°</b>.`;
      else if(a>0&&c>0) desc=`0°를 <b>통과</b>합니다. 첫 숫자 ${a}°는 0을 지나 반대 방향으로 더 간다는 뜻(과신전·과외전). 총 가동범위 <b>${a+c}°</b>.`;
      else desc=`0°에서 시작해 한 방향으로만 <b>${a+c}°</b>. (예: 순수 전두면 내전이 0인 견관절 F 표기)`;
    }
    OUT.innerHTML=`<div class="sftrbox" style="font-size:17px;text-align:center"><span class="k">${code}</span></div>
      ${notationSVG(a,b,c,mode)}
      <div class="box ${mode==='ankyl'?'crit':(b>0?'warn':'good')}">${desc}${note?'<br><br>'+note:''}</div>`;
  }
  [A,B,C,PL].forEach(el=>el.addEventListener('input',()=>{note='';render()}));
  ANK.addEventListener('click',()=>{mode=mode==='ankyl'?'normal':'ankyl';note='';
    ANK.textContent=mode==='ankyl'?'강직 모드 ✔ (해제)':'강직 모드 ⟳';
    ANK.style.background=mode==='ankyl'?'#b91c1c':'';ANK.style.color=mode==='ankyl'?'#fff':'';render();});
  document.getElementById('nPre').innerHTML=PRESETS.map((p,i)=>`<button data-i="${i}">${p[0]}</button>`).join('');
  document.getElementById('nPre').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    const p=PRESETS[+b.dataset.i];
    PL.value=p[1];A.value=p[2];B.value=p[3];C.value=p[4];
    mode=p[5];ANK.textContent=mode==='ankyl'?'강직 모드 ✔ (해제)':'강직 모드 ⟳';
    ANK.style.background=mode==='ankyl'?'#b91c1c':'';ANK.style.color=mode==='ankyl'?'#fff':'';
    note=p[6];render();
  });
  render();
})();

<script>
/* ===== 6. 정상치·불일치 ===== */
function lineChart(o){
  const w=344,h=228,L=40,R=28,T=26,B=40;
  const pw=w-L-R, ph=h-T-B;
  const ymin=o.ymin, ymax=o.ymax;
  const X=i=>L+pw*i/(o.x.length-1), Y=v=>T+ph*(1-(v-ymin)/(ymax-ymin));
  let s=`<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#fbfdff"/>`;
  for(let v=ymin;v<=ymax;v+=o.step){
    s+=`<line x1="${L}" y1="${fmt(Y(v))}" x2="${w-R}" y2="${fmt(Y(v))}" stroke="#e5ecf3" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${fmt(Y(v)+3.5)}" font-size="9" fill="#9fb0c0" text-anchor="end">${v}</text>`;
  }
  if(o.ref!==undefined&&o.ref<=ymax&&o.ref>=ymin){
    s+=`<line x1="${L}" y1="${fmt(Y(o.ref))}" x2="${w-R}" y2="${fmt(Y(o.ref))}" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>`;
    s+=`<text x="${w-R-2}" y="${fmt(Y(o.ref)-5)}" font-size="10" fill="#b91c1c" font-weight="800" text-anchor="end">${o.refLabel}</text>`;
  }
  o.x.forEach((lb,i)=>{s+=`<text x="${fmt(X(i))}" y="${h-B+15}" font-size="9" fill="#5b6b7c" text-anchor="middle">${lb}</text>`;});
  o.series.forEach(se=>{

{q:'80세 환자의 견관절 굴곡이 140°였다. AAOS 180°를 기준으로 "22% 제한"이라고 기록하는 것의 문제는?',
 o:['문제 없다','80대 남녀 평균이 134–140°이므로 연령 기준으로는 정상 범위이다','능동/수동을 안 적었다','좌우 비교를 안 했다'],a:1,
 e:'Gill 2020(n=2,404)에서 <b>80–84세 평균은 남 140.2°, 여 133.7°</b>입니다. 연령 보정 없이 절대치를 적용하면 <b>정상 고령자를 장해로 오판</b>합니다. (물론 능동/수동 표기와 좌우 비교도 필요하지만, 여기서 결론을 바꾸는 것은 연령 보정입니다.)'},
{q:'요추 굴곡 측정법 중 <b>신뢰도가 가장 좋은</b> 것으로 보고된 방법은?',
 o:['이중 경사계(AMA 채택)','Modified-Modified Schober(줄자)','Fingertip-to-floor','고관절 각도계법'],a:1,
 e:'Williams(Phys Ther 1993): MMS 재검사 r <b>0.78–0.89</b>, 검사자간 0.72 vs 이중 경사계 재검사 r <b>0.13–0.87</b>, 검사자간 0.60. 저자들은 "이중 경사계 기법은 개선이 필요하다"고 결론했습니다. <b>장해평가에서는 규정상 경사계를 쓰지만, 임상 추적에서는 MMS가 더 재현성이 좋습니다.</b>'},
{q:'경추 <b>회전</b>을 경사계로 측정할 때 앙와위를 권하는 이유는?',

 e:'앉은 자세에서는 <b>체간 회전을 배제할 수 없습니다.</b> 앙와위에서는 몸통이 침대에 고정되므로 순수 경추 회전에 가까워집니다.'},
{q:'거골하 내번/외번을 <b>좌위 전면법</b>으로 측정하고 "거골하 ROM"이라 보고했다. 문제는?',
 o:['문제 없다','중족부 운동이 포함되어 약 2배 과대평가된다','거골하 운동이 배제되어 과소평가된다','외번만 과대평가된다'],a:1,
 e:'검증 연구에서 총 내번–외번 범위가 <b>좌위 전면법 43.1±10.1° vs 복와위 후면법 24.2±6.4°</b>였습니다. 전면법은 <b>거골하+중족(transverse tarsal) 복합 운동</b>입니다. 어느 방법으로 쟀는지 반드시 기록하십시오.'},
{q:'고관절 회전 ROM은 앉은 자세와 복와위 중 어느 쪽이 더 큰가?',

 e:'통념과 반대로, 건강 성인 151명 연구에서 <b>"복와위가 앉은 자세보다 유의하게 컸다"</b>고 보고되었습니다. 신뢰도는 두 자세가 동등하므로 어느 쪽을 써도 되지만, <b>두 자세의 값을 서로 비교해서는 안 되며 반드시 자세를 기록</b>해야 합니다.'},

 e:'국내 표기에서 발목 <b>"굴곡"=족저굴곡, "신전"=족배굴곡</b>입니다. 임상 용어와 방향이 반대로 읽히기 쉬워 전공의가 가장 많이 혼동하는 부분입니다. 같은 표에서 전완 회내/회외를 "팔꿈치 내회전/외회전"으로 부르는 것도 같은 종류의 함정입니다.'},

 e:'이동팔은 <b>손이 아니라 원위 전완 표면</b>(회내는 배측, 회외는 수장측)에 정렬해야 합니다. 연필법도 간편하지만 같은 이유로 손목 움직임이 오차로 들어갑니다. 그리고 <b>팔꿈치가 몸에서 떨어지는 것</b>이 가장 큰 오차원입니다.'},

 e:'표준 각도판에서는 모든 기구가 ICC&gt;0.99지만 <b>실제 인체 어깨 굴곡에서는 95% LOA가 −11.0 ~ +11.4°</b>로 벌어집니다(Sci Rep 2023). 또한 스마트폰 앱은 <b>척추 축회전에서 부적합</b>하다는 보고가 많습니다(9편 중 4편).'}

(function(){
  const el=document.getElementById('s-quiz');
  let done=0, right=0;
  el.innerHTML=`<div class="score" id="qScore"><span>진행 0 / ${QZ.length}</span><span>정답 0</span></div>
   <div class="card"><h2 class="st">표기·측정 확인 퀴즈 (${QZ.length}문항)</h2>
   <p class="mute" style="margin-top:-4px">한 번 고르면 정답과 해설이 열립니다. 틀린 문항의 해설을 반드시 읽으십시오.</p></div>
   ${QZ.map((q,i)=>`<div class="q" data-i="${i}"><div class="num">Q${i+1}</div><div class="qt">${q.q}</div>
     ${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(9312+j)} ${o}</button>`).join('')}
     <div class="exp"><b>정답: ${String.fromCharCode(9312+q.a)}</b> — ${q.e}</div></div>`).join('')}`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b)return;
    const card=b.closest('.q'); if(card.classList.contains('done'))return;
    const i=+card.dataset.i, j=+b.dataset.j, a=QZ[i].a;
    card.classList.add('done'); done++; if(j===a) right++;
    card.querySelectorAll('.opt').forEach((o,k)=>{
      if(k===a)o.classList.add('ok'); else if(k===j)o.classList.add('no');
    });
    const sc=document.getElementById('qScore');
    sc.innerHTML=`<span>진행 ${done} / ${QZ.length}</span><span>정답 ${right} (${Math.round(right/done*100)}%)</span>`;
  });
})();
